# =========================================================

# EdgeCloudSim Configuration

# HES - Hierarchical Edge-Cloud Scheduling

# Scenario 1 - Semi-Urban Latin America

# =========================================================

# ---------------------------------------------------------

# Application usage

# ---------------------------------------------------------

app_usage_percentage=100

# ---------------------------------------------------------

# Simulation Time

# ---------------------------------------------------------

# 4 hours simulated 240 minutos

simulation_time=240

# Warm-up period   5 minutos

warm_up_period=5

# ---------------------------------------------------------

# Logging

# ---------------------------------------------------------

file_log_enabled=true
deep_file_log_enabled=false
# Evitar geração excessiva de arquivos CSV durante simulações em larga escala.

# VM utilization logging interval

vm_load_check_interval=1

# Mobility/location update interval

location_check_interval=0.5

# AP delay logging

ap_delay_check_interval=0

# ---------------------------------------------------------

# Mobile Devices

# ---------------------------------------------------------

# IMPORTANT:

# Start with small values for validation.

# Increase later for experiments.

min_number_of_mobile_devices=5000
max_number_of_mobile_devices=50000
mobile_device_counter_size=5000

# ---------------------------------------------------------

# Network Delays

# ---------------------------------------------------------

# WAN latency (~100ms)

wan_propagation_delay=0.1

# Internal LAN delay

lan_internal_delay=0.005

# ---------------------------------------------------------

# Bandwidths (Mbps)

# ---------------------------------------------------------

# School Wi-Fi

wlan_bandwidth=100

# Internet uplink

wan_bandwidth=20

# GSM fallback

gsm_bandwidth=2

# ---------------------------------------------------------

# Cloud Infrastructure

# ---------------------------------------------------------

number_of_host_on_cloud_datacenter=1

# Enough VMs to avoid premature rejection

number_of_vm_on_cloud_host=4

core_for_cloud_vm=2

# Strong cloud processing

mips_for_cloud_vm=40000

ram_for_cloud_vm=32000

storage_for_cloud_vm=1000000

# ---------------------------------------------------------

# Mobile Devices

# ---------------------------------------------------------

# Mobile only collects data

core_for_mobile_vm=0

mips_for_mobile_vm=0

ram_for_mobile_vm=0

storage_for_mobile_vm=0

# ---------------------------------------------------------

# Edge Infrastructure

# ---------------------------------------------------------

#Simulates ~40 schools

number_of_edge_hosts=40

number_of_vm_on_edge_host=1

core_for_edge_vm=2

mips_for_edge_vm=5000

ram_for_edge_vm=16000

storage_for_edge_vm=500000

# ---------------------------------------------------------

# Orchestrator Policy

# ---------------------------------------------------------

# HES policy

orchestrator_policies=CLOUD_FIRST,OFFLINE_DIRECT,EDGE_ONLY,HES
#orchestrator_policies=CLOUD_FIRST,OFFLINE_DIRECT,EDGE_ONLY,HES

# ---------------------------------------------------------

# Simulation Scenario

# ---------------------------------------------------------

simulation_scenarios=SCHOOL_NETWORK

# ---------------------------------------------------------

# Mobility / Waiting Times

# ---------------------------------------------------------

# School permanence times

attractiveness_L1_mean_waiting_time=18000

attractiveness_L2_mean_waiting_time=14400

attractiveness_L3_mean_waiting_time=7200

# ---------------------------------------------------------

# Connectivity Model

# ---------------------------------------------------------

# Semi-urban connectivity profile

# Low connectivity profile - rural
connectivity_probability=0.2
connectivity_on_mean_time=360
connectivity_off_mean_time=1440


# Moderate connectivity profile -Semi-urban
#connectivity_probability=0.5
#connectivity_on_mean_time=900
#connectivity_off_mean_time=900


# High connectivity profile - urban
#connectivity_probability=0.8
#connectivity_on_mean_time=1440
#connectivity_off_mean_time=360

# ---------------------------------------------------------

# Workload Characteristics

# ---------------------------------------------------------

# Photo + metadata upload

task_input_size=1200

task_output_size=400

task_length=500000

# ---------------------------------------------------------

# Synchronization

# ---------------------------------------------------------

offline_queue_check_interval=60

# ---------------------------------------------------------

# Experimental Notes

# ---------------------------------------------------------

# Validation phase:

# 10 -> 100 devices

#

# Experimental phase:

# 1000 -> 50000 devices

#

# IMPORTANT:

# validate logs before scaling

# to avoid CloudSim event loops

# ---------------------------------------------------------

